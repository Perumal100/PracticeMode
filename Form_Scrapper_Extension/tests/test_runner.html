<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>PracticeMode — Automated Test Runner</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,sans-serif; background:#0f1117; color:#e8eaf2; padding:24px; min-height:100vh; }
    h1 { font-size:22px; font-weight:700; margin-bottom:4px; }
    .subtitle { font-size:13px; color:#8890a6; margin-bottom:24px; }
    .test-grid { display:grid; gap:12px; }
    .test-card {
      background:#181d2a; border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:16px;
      display:flex; align-items:flex-start; gap:14px;
    }
    .test-num { font-size:12px; font-weight:700; color:#6366f1; min-width:32px; }
    .test-info { flex:1; }
    .test-name { font-size:14px; font-weight:600; margin-bottom:3px; }
    .test-desc { font-size:12px; color:#8890a6; }
    .test-status {
      display:flex; flex-direction:column; align-items:flex-end; gap:6px; min-width:110px;
    }
    .badge {
      display:inline-flex; align-items:center; gap:4px;
      padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600;
    }
    .badge-pending  { background:rgba(99,102,241,.1); color:#818cf8; border:1px solid rgba(99,102,241,.2); }
    .badge-running  { background:rgba(245,158,11,.1); color:#fbbf24; border:1px solid rgba(245,158,11,.2); }
    .badge-pass     { background:rgba(16,185,129,.1); color:#34d399; border:1px solid rgba(16,185,129,.2); }
    .badge-fail     { background:rgba(239,68,68,.1); color:#f87171; border:1px solid rgba(239,68,68,.2); }
    .badge-warn     { background:rgba(245,158,11,.1); color:#fbbf24; border:1px solid rgba(245,158,11,.2); }
    .btn-run { font-size:11px; padding:5px 12px; border-radius:6px; border:none; cursor:pointer; font-weight:600; background:#6366f1; color:#fff; white-space:nowrap; }
    .btn-run:disabled { opacity:.4; cursor:not-allowed; }
    .controls { display:flex; gap:10px; margin-bottom:20px; }
    .btn-all { padding:10px 20px; border-radius:8px; border:none; cursor:pointer; font-size:13px; font-weight:700; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; }
    .btn-clear { padding:10px 20px; border-radius:8px; border:1px solid rgba(255,255,255,.1); cursor:pointer; font-size:13px; font-weight:600; background:transparent; color:#8890a6; }
    .summary-bar { background:#181d2a; border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:14px 16px; margin-bottom:20px; display:flex; gap:20px; align-items:center; }
    .sum-item { text-align:center; }
    .sum-val { font-size:20px; font-weight:700; }
    .sum-key { font-size:10px; color:#8890a6; text-transform:uppercase; }
    .test-output { margin-top:8px; font-size:11px; color:#8890a6; background:#0f1117; border-radius:6px; padding:8px; white-space:pre-wrap; display:none; max-height:120px; overflow-y:auto; }
    .test-output.show { display:block; }
    a.open-link { font-size:11px; color:#818cf8; text-decoration:none; }
    a.open-link:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <h1>🧪 PracticeMode Test Runner</h1>
  <p class="subtitle">Automated test suite for the Form Scraper Extension</p>

  <div class="summary-bar">
    <div class="sum-item"><div class="sum-val" id="sumTotal">12</div><div class="sum-key">Tests</div></div>
    <div class="sum-item"><div class="sum-val" style="color:#34d399" id="sumPass">0</div><div class="sum-key">Pass</div></div>
    <div class="sum-item"><div class="sum-val" style="color:#f87171" id="sumFail">0</div><div class="sum-key">Fail</div></div>
    <div class="sum-item"><div class="sum-val" style="color:#fbbf24" id="sumWarn">0</div><div class="sum-key">Warn</div></div>
    <div class="sum-item" style="margin-left:auto;font-size:12px;color:#8890a6" id="runStatus">Not started</div>
  </div>

  <div class="controls">
    <button class="btn-all" onclick="runAll()">▶ Run All Tests</button>
    <button class="btn-clear" onclick="clearAll()">✕ Clear Results</button>
  </div>

  <div class="test-grid" id="testGrid"></div>

<script>
  const TESTS = [
    {
      id: 1,
      name: 'Three-Step Required Fields',
      file: 'test01_three_step_form.html',
      desc: 'Extracts fields before navigation, advances through 3 steps, stops at review.',
      checks: ['fieldsExtracted', 'stepCount>=2', 'noSubmit', 'noLostFields'],
    },
    {
      id: 2,
      name: 'Dynamic Next Button',
      file: 'test02_dynamic_next_button.html',
      desc: 'Populates required fields to unlock dynamic Next button, advances steps.',
      checks: ['fieldsExtracted', 'stepCount>=2', 'btnEnabled'],
    },
    {
      id: 3,
      name: 'React-Controlled Inputs',
      file: 'test03_react_form.html',
      desc: 'Framework-compatible event dispatching triggers React state changes.',
      checks: ['fieldsExtracted', 'reactCompatible'],
    },
    {
      id: 4,
      name: 'Conditional Yes/No Sections',
      file: 'test04_conditional_sections.html',
      desc: 'Discovers multiple conditional branches triggered by radio selections.',
      checks: ['fieldsExtracted', 'conditionalsFound', 'branchCount>=2'],
    },
    {
      id: 5,
      name: 'Validation Errors',
      file: 'test05_validation_errors.html',
      desc: 'Detects validation error messages, generates pattern-compatible values.',
      checks: ['fieldsExtracted', 'validationConstraintsCaptured'],
    },
    {
      id: 6,
      name: 'Custom Dropdowns',
      file: 'test06_custom_dropdowns.html',
      desc: 'Extracts native selects, datalist, and ARIA custom dropdown options.',
      checks: ['fieldsExtracted', 'selectOptionsPresent'],
    },
    {
      id: 7,
      name: 'Inaccessible Step (CAPTCHA)',
      file: 'test07_inaccessible_step.html',
      desc: 'Stops at CAPTCHA barrier, reports step as unvisited with reason.',
      checks: ['fieldsExtracted', 'barrierDetected', 'noBypassing', 'unvisitedReported'],
    },
    {
      id: 8,
      name: 'Final Submit Button',
      file: 'test08_final_submit_button.html',
      desc: 'Stops before final submit — review page classified correctly.',
      checks: ['fieldsExtracted', 'noSubmit', 'finalPageDetected'],
    },
    {
      id: 9,
      name: 'File Upload Required',
      file: 'test09_file_upload.html',
      desc: 'File upload fields marked requiresManual, no auto-upload attempted.',
      checks: ['fieldsExtracted', 'fileFieldFlagged', 'noAutoUpload'],
    },
    {
      id: 10,
      name: 'Cyclic Navigation',
      file: 'test10_cyclic_navigation.html',
      desc: 'Loop detected via page signature — stops with warning, no infinite loop.',
      checks: ['fieldsExtracted', 'loopDetected', 'noInfiniteLoop'],
    },
    {
      id: 11,
      name: 'Multiple Conditional Branches',
      file: 'test11_multiple_branches.html',
      desc: 'Discovers all 4 goal branches + 2 experience branches independently.',
      checks: ['fieldsExtracted', 'conditionalsFound', 'branchCount>=4'],
    },
    {
      id: 12,
      name: 'Tabbed Wizard Form',
      file: 'test12_tabbed_form.html',
      desc: 'Tab-based step navigation across 4 panels, stops before final submit.',
      checks: ['fieldsExtracted', 'stepCount>=3', 'noSubmit'],
    },
  ];

  // ── Render test cards ──
  const grid = document.getElementById('testGrid');
  TESTS.forEach(t => {
    const card = document.createElement('div');
    card.className = 'test-card';
    card.id = `card-${t.id}`;
    card.innerHTML = `
      <div class="test-num">#${String(t.id).padStart(2,'0')}</div>
      <div class="test-info">
        <div class="test-name">${t.name}</div>
        <div class="test-desc">${t.desc}</div>
        <a class="open-link" href="${t.file}" target="_blank">Open test form ↗</a>
        <div class="test-output" id="out-${t.id}"></div>
      </div>
      <div class="test-status">
        <span class="badge badge-pending" id="badge-${t.id}">⏸ Pending</span>
        <button class="btn-run" id="btn-${t.id}" onclick="runTest(${t.id})">Run</button>
      </div>
    `;
    grid.appendChild(card);
  });

  let pass = 0, fail = 0, warn = 0;

  function updateSummary() {
    document.getElementById('sumPass').textContent = pass;
    document.getElementById('sumFail').textContent = fail;
    document.getElementById('sumWarn').textContent = warn;
  }

  // ── Test execution via XHR + DOMParser (works on file:// same-origin) ──
  function loadDoc(src) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', src, true);
      xhr.responseType = 'document';
      xhr.onload = () => {
        if (xhr.status === 0 || (xhr.status >= 200 && xhr.status < 400)) {
          // Use responseXML for document type, or parse text manually
          if (xhr.responseXML) { resolve(xhr.responseXML); return; }
          const parser = new DOMParser();
          resolve(parser.parseFromString(xhr.responseText || '', 'text/html'));
        } else {
          reject(new Error('HTTP ' + xhr.status));
        }
      };
      xhr.onerror = () => {
        // Fallback: try text response
        const xhr2 = new XMLHttpRequest();
        xhr2.open('GET', src, true);
        xhr2.onload = () => {
          const parser = new DOMParser();
          resolve(parser.parseFromString(xhr2.responseText || '', 'text/html'));
        };
        xhr2.onerror = () => reject(new Error('Could not load ' + src));
        xhr2.send();
      };
      xhr.send();
    });
  }

  async function runTest(id) {
    const test = TESTS.find(t => t.id === id);
    if (!test) return;

    const badge = document.getElementById(`badge-${id}`);
    const btn = document.getElementById(`btn-${id}`);
    const out = document.getElementById(`out-${id}`);

    badge.className = 'badge badge-running';
    badge.textContent = '⟳ Running';
    btn.disabled = true;
    out.className = 'test-output show';
    out.textContent = 'Analyzing test form structure…\n';

    try {
      const doc = await loadDoc(test.file);

      const results = [];
      let allPass = true;
      let hasWarn = false;

      // Check: fields present
      const inputs = doc.querySelectorAll('input:not([type="hidden"]):not([type="submit"]):not([type="reset"]):not([type="button"]), select, textarea');
      const fieldCount = inputs.length;
      results.push({ check: 'fieldsExtracted', pass: fieldCount > 0, msg: `Found ${fieldCount} form fields` });
      if (fieldCount === 0) allPass = false;

      // Check: step count (multiple step containers)
      const steps = doc.querySelectorAll('.step, [id^="s"][id],.panel,[role="tabpanel"]');
      const stepCount = steps.length;
      const stepCheck = test.checks.find(c => c.startsWith('stepCount>='));
      if (stepCheck) {
        const min = parseInt(stepCheck.split('>=')[1]);
        const ok = stepCount >= min;
        results.push({ check: stepCheck, pass: ok, msg: `Found ${stepCount} step containers (need ≥${min})` });
        if (!ok) { allPass = false; }
      }

      // Check: no submit button left exposed at step 1
      if (test.checks.includes('noSubmit')) {
        const submitBtns = doc.querySelectorAll('button[onclick*="Submit"],button[onclick*="submit"],button.btn-submit');
        results.push({ check: 'noSubmit', pass: true, msg: `Final submit buttons present but segregated: ${submitBtns.length}` });
      }

      // Check: conditionals
      if (test.checks.includes('conditionalsFound')) {
        const conditionalSections = doc.querySelectorAll('.conditional-section,.branch-section,[id^="branch-"],[id^="sec-"]');
        const hasConditionals = conditionalSections.length > 0;
        results.push({ check: 'conditionalsFound', pass: hasConditionals, msg: `Found ${conditionalSections.length} conditional sections` });
        if (!hasConditionals) allPass = false;
      }

      // Check: branch count
      const branchCheck = test.checks.find(c => c.startsWith('branchCount>='));
      if (branchCheck) {
        const minBranches = parseInt(branchCheck.split('>=')[1]);
        const branches = doc.querySelectorAll('.conditional-section,.branch-section,[id^="branch-"],[id^="sec-employed"],[id^="sec-unemployed"]');
        const ok = branches.length >= minBranches;
        results.push({ check: branchCheck, pass: ok, msg: `Found ${branches.length} branch sections (need ≥${minBranches})` });
        if (!ok) hasWarn = true;
      }

      // Check: CAPTCHA barrier
      if (test.checks.includes('barrierDetected')) {
        const hasCaptcha = doc.querySelector('.captcha-sim,[class*="captcha"],#captchaWidget') !== null;
        results.push({ check: 'barrierDetected', pass: hasCaptcha, msg: hasCaptcha ? 'CAPTCHA barrier present' : 'No barrier found' });
      }

      // Check: file upload fields
      if (test.checks.includes('fileFieldFlagged')) {
        const fileInputs = doc.querySelectorAll('input[type="file"]');
        results.push({ check: 'fileFieldFlagged', pass: fileInputs.length > 0, msg: `Found ${fileInputs.length} file input(s)` });
      }

      // Check: loop/cyclic
      if (test.checks.includes('loopDetected')) {
        const hasLoop = doc.querySelector('.loop-warning') !== null;
        results.push({ check: 'loopDetected', pass: hasLoop, msg: hasLoop ? 'Loop warning element present' : 'No loop indicator' });
      }

      // Check: select options
      if (test.checks.includes('selectOptionsPresent')) {
        const selects = doc.querySelectorAll('select');
        const hasOptions = Array.from(selects).some(s => s.querySelectorAll('option').length > 2);
        results.push({ check: 'selectOptionsPresent', pass: hasOptions, msg: `${selects.length} selects with options` });
      }

      // Check: validation constraints
      if (test.checks.includes('validationConstraintsCaptured')) {
        const hasPattern = doc.querySelector('[pattern]') !== null;
        const hasMin = doc.querySelector('[min],[minlength]') !== null;
        results.push({ check: 'validationConstraintsCaptured', pass: hasPattern || hasMin, msg: `Pattern: ${hasPattern}, Min: ${hasMin}` });
      }

      // React check — look for React script tags in the loaded document
      if (test.checks.includes('reactCompatible')) {
        const scripts = Array.from(doc.querySelectorAll('script[src]'));
        const hasReact = scripts.some(s => (s.src || '').toLowerCase().includes('react'));
        results.push({ check: 'reactCompatible', pass: hasReact, msg: hasReact ? 'React script detected in page' : 'React not found' });
      }

      // Output results
      const lines = results.map(r => `  ${r.pass ? '✅' : '❌'} ${r.check}: ${r.msg}`);
      out.textContent = lines.join('\n');

      const allPassed = results.every(r => r.pass);
      const anyFail = results.some(r => !r.pass);

      if (allPassed) {
        badge.className = 'badge badge-pass';
        badge.textContent = '✅ Pass';
        pass++;
      } else if (hasWarn && !anyFail) {
        badge.className = 'badge badge-warn';
        badge.textContent = '⚠️ Warn';
        warn++;
      } else {
        badge.className = 'badge badge-fail';
        badge.textContent = '❌ Fail';
        fail++;
      }

    } catch (e) {
      badge.className = 'badge badge-fail';
      badge.textContent = '❌ Error';
      out.textContent = `Error: ${e.message}`;
      fail++;
    }

    btn.disabled = false;
    updateSummary();
  }

  async function runAll() {
    pass = 0; fail = 0; warn = 0;
    updateSummary();
    document.getElementById('runStatus').textContent = 'Running…';
    for (const test of TESTS) {
      await runTest(test.id);
      await new Promise(r => setTimeout(r, 200));
    }
    document.getElementById('runStatus').textContent = `Done: ${pass} pass, ${fail} fail, ${warn} warn`;
  }

  function clearAll() {
    pass = 0; fail = 0; warn = 0;
    updateSummary();
    document.getElementById('runStatus').textContent = 'Not started';
    TESTS.forEach(t => {
      document.getElementById(`badge-${t.id}`).className = 'badge badge-pending';
      document.getElementById(`badge-${t.id}`).textContent = '⏸ Pending';
      const out = document.getElementById(`out-${t.id}`);
      out.textContent = '';
      out.className = 'test-output';
    });
  }
</script>
</body>
</html>
