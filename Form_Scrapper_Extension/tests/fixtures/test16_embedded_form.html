<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Senior Software Engineer - Example Careers</title>
  <link rel="stylesheet" href="_shared.css"/>
</head>
<body>
  <!-- A careers page that embeds its application form from another origin,
       like a company page embedding a Greenhouse job application. -->
  <h1>Senior Software Engineer</h1>
  <p>New York, NY · Engineering</p>
  <iframe id="application" title="Job application" style="width:100%;height:900px;border:0"></iframe>
  <script>
    // Same port, different host: 127.0.0.1 is a different origin from localhost.
    document.getElementById('application').src =
      `${location.protocol}//127.0.0.1:${location.port}/test01_three_step_form.html?for=example&token=embed-secret`;
  </script>
</body>
</html>
