<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Test 15 — Web components with shadow DOM</title>
  <link rel="stylesheet" href="_shared.css"/>
</head>
<body>
<div class="card">
  <h1>Library Card Signup</h1>
  <!-- The whole wizard lives inside an open shadow root, as in many
       web-component design systems. -->
  <signup-wizard></signup-wizard>
</div>
<script>
  class SignupWizard extends HTMLElement {
    constructor() {
      super();
      this.step = 1;
      this.root = this.attachShadow({ mode: 'open' });
      this.render();
    }
    render() {
      const css = `<style>
        label { display:block; font: 600 13px system-ui; margin-bottom: 5px; }
        input, select { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 14px; }
        input[type=radio] { width: auto; margin: 0 6px 0 0; }
        .choice { display:inline-flex; font-weight:400; margin-right: 14px; }
        p { font: 13px system-ui; color: #666; }
        button { padding: 10px 22px; border-radius: 8px; border: none; background: #6366f1; color: #fff; font-weight: 600; cursor: pointer; }
        .row { display:flex; justify-content:flex-end; gap: 10px; }
        .err { color:#b91c1c; font: 12px system-ui; display:none; }
      </style>`;
      if (this.step === 1) {
        this.root.innerHTML = `${css}
          <p>Step 1 of 3 — Address</p>
          <label for="street">Street address *</label><input id="street" name="street" required autocomplete="address-line1"/>
          <label for="city">City *</label><input id="city" name="city" required/>
          <label for="state">State *</label>
          <select id="state" name="state" required>
            <option value="">Select state</option><option value="NY">New York</option><option value="NJ">New Jersey</option><option value="CT">Connecticut</option>
          </select>
          <div class="err" id="err">Please complete the address.</div>
          <div class="row"><button id="next1">Next</button></div>`;
        this.root.getElementById('next1').addEventListener('click', () => {
          const ok = ['street', 'city', 'state'].every((id) => this.root.getElementById(id).value);
          this.root.getElementById('err').style.display = ok ? 'none' : 'block';
          if (ok) { this.step = 2; this.render(); }
        });
      } else if (this.step === 2) {
        this.root.innerHTML = `${css}
          <p>Step 2 of 3 — Preferences</p>
          <label>How should we contact you? *</label>
          <label class="choice"><input type="radio" name="contact" value="email" required/>Email</label>
          <label class="choice"><input type="radio" name="contact" value="sms"/>Text message</label>
          <label class="choice"><input type="radio" name="contact" value="none"/>Don't contact me</label>
          <div class="row"><button id="back2" style="background:#eee;color:#333">Back</button><button id="next2">Next</button></div>`;
        this.root.getElementById('back2').addEventListener('click', () => { this.step = 1; this.render(); });
        this.root.getElementById('next2').addEventListener('click', () => {
          if (this.root.querySelector('input[name=contact]:checked')) { this.step = 3; this.render(); }
        });
      } else {
        this.root.innerHTML = `${css}
          <p>Step 3 of 3 — Review</p>
          <p>Check your details, then submit.</p>
          <div class="row"><button id="submit">Submit signup</button></div>`;
        this.root.getElementById('submit').addEventListener('click', () => alert('PracticeMode: Submission blocked.'));
      }
    }
  }
  customElements.define('signup-wizard', SignupWizard);
</script>
</body>
</html>
