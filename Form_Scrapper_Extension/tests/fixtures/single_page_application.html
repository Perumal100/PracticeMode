<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Engineer Intern - 2027 Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h2 {
            margin-top: 0;
            color: #111;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .radio-group label {
            font-weight: normal;
            display: inline-block;
            margin-right: 15px;
            margin-bottom: 0;
        }
        .radio-group input {
            margin-right: 5px;
        }
        .help-text {
            font-size: 0.85em;
            color: #666;
            margin-top: 4px;
            display: block;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Software Engineer Intern - 2027</h2>
    <form action="#" method="POST" enctype="multipart/form-data">

        <!-- Unlabeled File (General attachment) -->
        <div class="form-group">
            <label for="unlabeled_file">Unlabeled file</label>
            <input type="file" id="unlabeled_file" name="unlabeled_file" accept="application/pdf,.pdf,application/msword,.doc,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.docx,application/vnd.oasis.opendocument.text,.odt,application/rtf,.rtf,text/plain,.txt,text/markdown,.md">
        </div>

        <!-- Name -->
        <div class="form-group">
            <label for="_systemfield_name">Name <span style="color:red;">*</span></label>
            <input type="text" id="_systemfield_name" name="_systemfield_name" placeholder="Type here..." required>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="_systemfield_email">Email <span style="color:red;">*</span></label>
            <input type="email" id="_systemfield_email" name="_systemfield_email" placeholder="hello@example.com..." required>
        </div>

        <!-- Phone -->
        <div class="form-group">
            <label for="a0e1b56c-a230-4ead-8df2-86fc90d9a562">Phone <span style="color:red;">*</span></label>
            <input type="tel" id="a0e1b56c-a230-4ead-8df2-86fc90d9a562" name="a0e1b56c-a230-4ead-8df2-86fc90d9a562" placeholder="1-415-555-1234..." required>
        </div>

        <!-- Resume -->
        <div class="form-group">
            <label for="_systemfield_resume">Resume <span style="color:red;">*</span></label>
            <input type="file" id="_systemfield_resume" name="_systemfield_resume" accept="application/pdf,.pdf,application/msword,.doc,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.docx,application/vnd.oasis.opendocument.text,.odt,application/rtf,.rtf,text/plain,.txt,text/markdown,.md,image/*,video/*,audio/*" required>
        </div>

        <!-- Other Attachments -->
        <div class="form-group">
            <label for="c645526c-d421-4db3-8168-fa4c79a3d644">Other Attachments</label>
            <input type="file" id="c645526c-d421-4db3-8168-fa4c79a3d644" name="c645526c-d421-4db3-8168-fa4c79a3d644" accept="application/pdf,.pdf,application/msword,.doc,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.docx,application/vnd.oasis.opendocument.text,.odt,application/rtf,.rtf,text/plain,.txt,text/markdown,.md,image/*,video/*,audio/*">
        </div>

        <!-- LinkedIn Profile URL -->
        <div class="form-group">
            <label for="9c370f9c-4cd5-4a03-aa32-d11b4530135a">LinkedIn Profile URL</label>
            <input type="text" id="9c370f9c-4cd5-4a03-aa32-d11b4530135a" name="9c370f9c-4cd5-4a03-aa32-d11b4530135a" placeholder="Type here...">
        </div>

        <!-- Other URLs -->
        <div class="form-group">
            <label for="b8d274ac-5636-47a5-b392-9fdb126da5dd">Other URLs</label>
            <input type="text" id="b8d274ac-5636-47a5-b392-9fdb126da5dd" name="b8d274ac-5636-47a5-b392-9fdb126da5dd" placeholder="Type here...">
        </div>

        <!-- Current University -->
        <div class="form-group">
            <label for="5698013f-54e6-427a-9975-3653e88903b0">Current University <span style="color:red;">*</span></label>
            <input type="text" id="5698013f-54e6-427a-9975-3653e88903b0" name="5698013f-54e6-427a-9975-3653e88903b0" placeholder="Type here..." required>
        </div>

        <!-- Anticipated Graduation Date -->
        <div class="form-group">
            <label for="4c591a6f-0a75-4ab2-a5de-bb9b1a9174f0">What is your anticipated graduation date? <span style="color:red;">*</span></label>
            <input type="text" id="4c591a6f-0a75-4ab2-a5de-bb9b1a9174f0" name="4c591a6f-0a75-4ab2-a5de-bb9b1a9174f0" placeholder="Type here..." required>
        </div>

        <!-- Radio Options (Location Preference) -->
        <div class="form-group">
            <label>Location Preference</label>
            <div class="radio-group">
                <label><input type="radio" name="location_pref" value="San Mateo, CA"> San Mateo, CA</label>
                <label><input type="radio" name="location_pref" value="San Diego, CA"> San Diego, CA</label>
                <label><input type="radio" name="location_pref" value="New York, NY"> New York, NY</label>
                <label><input type="radio" name="location_pref" value="Remote"> Remote</label>
            </div>
        </div>

        <!-- Unlabeled text input ("Start typing...") -->
        <div class="form-group">
            <label for="start_typing">Additional Field</label>
            <input type="text" id="start_typing" name="start_typing" placeholder="Start typing...">
        </div>

        <!-- Additional Information -->
        <div class="form-group">
            <label for="9d4e72a6-5596-434c-9f78-78a1acf47d65">Additional Information</label>
            <textarea id="9d4e72a6-5596-434c-9f78-78a1acf47d65" name="9d4e72a6-5596-434c-9f78-78a1acf47d65" placeholder="Type here..."></textarea>
            <small class="help-text">Add anything else you want to share</small>
        </div>

        <!-- Pick date field -->
        <div class="form-group">
            <label for="pick_date">Pick date... <span style="color:red;">*</span></label>
            <input type="text" id="pick_date" name="pick_date" placeholder="Pick date..." required>
        </div>

        <button type="submit">Submit Application</button>
    </form>
</div>

</body>
</html>
