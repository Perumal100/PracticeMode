<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Test 6 — Custom Dropdowns</title>
  <style>
    body { font-family:system-ui,sans-serif; background:#f5f5f5; display:flex; justify-content:center; padding:40px 16px; }
    .card { background:#fff; border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,.1); padding:32px; width:100%; max-width:480px; }
    h1 { font-size:20px; margin-bottom:4px; }
    .subtitle { font-size:13px; color:#666; margin-bottom:24px; }
    .field { margin-bottom:20px; }
    label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:#333; }
    /* Native select (for baseline) */
    select.native { width:100%; padding:10px 12px; border:1.5px solid #ddd; border-radius:8px; font-size:14px; }
    /* Custom dropdown */
    .custom-select { position:relative; }
    .custom-select .trigger {
      width:100%; padding:10px 12px; border:1.5px solid #ddd; border-radius:8px; font-size:14px; cursor:pointer;
      background:#fff; display:flex; justify-content:space-between; align-items:center; user-select:none;
    }
    .custom-select .trigger:after { content:'▾'; color:#999; }
    .custom-select .trigger[aria-expanded="true"] { border-color:#6366f1; }
    .custom-select .dropdown {
      position:absolute; top:calc(100% + 4px); left:0; right:0;
      background:#fff; border:1.5px solid #ddd; border-radius:8px;
      box-shadow:0 8px 24px rgba(0,0,0,.12); z-index:100; display:none; overflow:hidden;
    }
    .custom-select .dropdown.open { display:block; }
    .custom-select .option { padding:10px 14px; font-size:14px; cursor:pointer; transition:.15s; }
    .custom-select .option:hover { background:#f3f4f6; }
    .custom-select .option.selected { background:#ede9fe; color:#6366f1; font-weight:600; }
    /* Hidden input to hold actual value */
    .custom-select input[type="hidden"] { display:none; }
    .btn-row { display:flex; justify-content:flex-end; margin-top:20px; }
    .btn { padding:10px 24px; border-radius:8px; border:none; font-size:13px; font-weight:600; cursor:pointer; background:#6366f1; color:#fff; }
    .tag-container { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
    .tag { background:#ede9fe; color:#6366f1; border-radius:20px; padding:4px 10px; font-size:12px; display:flex; align-items:center; gap:4px; }
    .tag button { border:none; background:none; color:#6366f1; cursor:pointer; font-size:14px; padding:0; }
  </style>
</head>
<body>
<div class="card">
  <h1>Preference Setup</h1>
  <p class="subtitle">Tests native selects, custom dropdowns, and multi-select tags.</p>

  <!-- Native select -->
  <div class="field">
    <label for="nativeCountry">Country (native select)</label>
    <select class="native" id="nativeCountry" name="country" aria-label="Country">
      <option value="">-- Select country --</option>
      <option value="US">United States</option>
      <option value="CA">Canada</option>
      <option value="GB">United Kingdom</option>
      <option value="AU">Australia</option>
      <option value="DE">Germany</option>
    </select>
  </div>

  <!-- Custom dropdown with aria -->
  <div class="field">
    <label id="lang-label">Preferred Language (custom dropdown)</label>
    <div class="custom-select" role="combobox" aria-labelledby="lang-label">
      <div class="trigger" role="button" aria-expanded="false" aria-haspopup="listbox" tabindex="0"
           id="lang-trigger" onclick="toggleDropdown('lang')">
        <span id="lang-display">Select a language</span>
      </div>
      <div class="dropdown" id="lang-dropdown" role="listbox" aria-label="Language options">
        <div class="option" role="option" onclick="selectOption('lang','en','English')">English</div>
        <div class="option" role="option" onclick="selectOption('lang','es','Spanish')">Spanish</div>
        <div class="option" role="option" onclick="selectOption('lang','fr','French')">French</div>
        <div class="option" role="option" onclick="selectOption('lang','de','German')">German</div>
        <div class="option" role="option" onclick="selectOption('lang','zh','Chinese')">Chinese</div>
      </div>
      <input type="hidden" id="lang-value" name="language" aria-label="Preferred Language"/>
    </div>
  </div>

  <!-- Custom dropdown: experience level -->
  <div class="field">
    <label id="exp-label">Experience Level (custom dropdown) <span style="color:red">*</span></label>
    <div class="custom-select" role="combobox" aria-labelledby="exp-label">
      <div class="trigger" role="button" aria-expanded="false" aria-haspopup="listbox" tabindex="0"
           id="exp-trigger" onclick="toggleDropdown('exp')">
        <span id="exp-display">Select level</span>
      </div>
      <div class="dropdown" id="exp-dropdown" role="listbox">
        <div class="option" role="option" onclick="selectOption('exp','entry','Entry Level')">Entry Level</div>
        <div class="option" role="option" onclick="selectOption('exp','mid','Mid Level')">Mid Level</div>
        <div class="option" role="option" onclick="selectOption('exp','senior','Senior')">Senior</div>
        <div class="option" role="option" onclick="selectOption('exp','lead','Lead / Principal')">Lead / Principal</div>
      </div>
      <input type="hidden" id="exp-value" name="experienceLevel" aria-label="Experience Level" aria-required="true"/>
    </div>
  </div>

  <!-- Searchable input with datalist -->
  <div class="field">
    <label for="city">City (searchable datalist)</label>
    <input type="text" id="city" name="city" list="city-list" placeholder="Start typing a city…" aria-label="City"/>
    <datalist id="city-list">
      <option value="New York"/>
      <option value="Los Angeles"/>
      <option value="Chicago"/>
      <option value="Houston"/>
      <option value="Phoenix"/>
      <option value="Philadelphia"/>
    </datalist>
  </div>

  <div class="btn-row">
    <button class="btn" onclick="alert('PracticeMode: Submission blocked.')">Save Preferences</button>
  </div>
</div>

<script>
  function toggleDropdown(id) {
    const trigger = document.getElementById(`${id}-trigger`);
    const dropdown = document.getElementById(`${id}-dropdown`);
    const isOpen = dropdown.classList.contains('open');
    // Close all
    document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
    document.querySelectorAll('.trigger[aria-expanded="true"]').forEach(t => t.setAttribute('aria-expanded','false'));
    if (!isOpen) {
      dropdown.classList.add('open');
      trigger.setAttribute('aria-expanded','true');
    }
  }
  function selectOption(id, value, label) {
    document.getElementById(`${id}-display`).textContent = label;
    document.getElementById(`${id}-value`).value = value;
    document.getElementById(`${id}-dropdown`).classList.remove('open');
    document.getElementById(`${id}-trigger`).setAttribute('aria-expanded','false');
    // Dispatch change event for extraction
    const input = document.getElementById(`${id}-value`);
    input.dispatchEvent(new Event('change', { bubbles:true }));
  }
  // Close on outside click
  document.addEventListener('click', e => {
    if (!e.target.closest('.custom-select')) {
      document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
    }
  });
</script>
</body>
</html>
